name: Deploy Web Game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Get wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          VERSION=$(awk -F '"' '/^name = "wasm-bindgen"$/ { getline; print $2; exit }' Cargo.lock)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Build WebAssembly (Release)
        run: |
          cargo build --release --target wasm32-unknown-unknown

      - name: Generate JS bindings with wasm-bindgen
        run: |
          mkdir -p dist
          wasm-bindgen --out-dir dist --target web target/wasm32-unknown-unknown/release/game.wasm
          cp index.html dist/
          # Если появятся ассеты в папке assets/, копируем их
          if [ -d "assets" ]; then cp -r assets dist/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
