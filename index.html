<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FarmLoveCraft - Web Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #c9d1d9;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #loading {
            position: absolute;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .spinner {
            margin: 15px auto 0;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #a3223f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="loading">
        <div>Загрузка FarmLoveCraft...</div>
        <div class="spinner"></div>
    </div>

    <script type="module">
        import init from './game.js';

        async function run() {
            try {
                await init('./game_bg.wasm');
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.remove(), 500);
                }
            } catch (err) {
                console.error("Failed to start game:", err);
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.innerHTML = '<div style="color: #ff6b6b;">Ошибка запуска игры.<br>Убедитесь, что ваш браузер поддерживает WebGPU/WebGL2.</div>';
                }
            }
        }

        run();
    </script>
</body>
</html>
